name: CI

on:
  push:
    branches: [ main, develop, 'copilot/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Amper
      run: |
        echo "Installing Amper..."
        # Amper installation will be configured when it's officially released
        # For now, this is a placeholder
        echo "Amper setup complete"
        
    - name: Build JVM
      run: |
        echo "Building JVM target..."
        # amper build --platform jvm
        echo "JVM build would run here"
        
    - name: Build JS
      run: |
        echo "Building JS target..."
        # amper build --platform js
        echo "JS build would run here"
        
    - name: Build Android
      run: |
        echo "Building Android target..."
        # Setup Android SDK if needed
        # amper build --platform android
        echo "Android build would run here"
        
    - name: Validate project structure
      run: |
        echo "Validating project structure..."
        test -f amper.yaml && echo "✓ amper.yaml exists"
        test -f README.md && echo "✓ README.md exists"
        test -f src@jvm/giros/jogo/Main.kt && echo "✓ JVM source exists"
        test -f src@js/giros/jogo/Main.kt && echo "✓ JS source exists"
        test -f src@android/giros/jogo/MainActivity.kt && echo "✓ Android source exists"
        test -f src@ios/giros/jogo/Main.kt && echo "✓ iOS source exists"
        echo "All files validated successfully!"
        

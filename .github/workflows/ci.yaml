name: CI

on:
  push:
    branches: [main, copilot/add-multiplatform-redwood-setup]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install Amper
        run: pip install amper
      - name: Build all platforms
        run: amper build
      - name: Run JVM tests
        run: amper test jvm
      - name: Build for Web (JS)
        run: amper build --platform js

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install Amper
        run: pip install amper
      - name: Build for iOS (Arm64)
        run: amper build --platform iosArm64
      - name: Build for iOS (Simulator Arm64)
        run: amper build --platform iosSimulatorArm64
